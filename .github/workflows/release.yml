name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quality checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run audit
          npm test

      - name: Build
        run: npm run build

      - name: Build standalone binaries (arm64 & x64)
        run: npm run build:standalone

      - name: Generate checksums
        run: |
          cd dist-standalone
          shasum -a 256 capheden-macos-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-standalone/capheden-macos-arm64
            dist-standalone/capheden-macos-x64
            dist-standalone/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
